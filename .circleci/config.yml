version: 2.1

jobs:
  playwright-tests:
    docker:
      # Keep this tag in step with the @playwright/test version in package-lock.json
      - image: mcr.microsoft.com/playwright:v1.55.0-noble
    resource_class: medium
    environment:
      CI: "true"
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run Playwright tests (Chromium)
          # APP_EMAIL, APP_PASSWORD and BASE_URL come from CircleCI project environment variables
          command: npx playwright test --project=chromium
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports
          destination: reports
          when: always
      - store_artifacts:
          path: screenshots
          destination: screenshots
          when: always

workflows:
  test:
    jobs:
      - playwright-tests
